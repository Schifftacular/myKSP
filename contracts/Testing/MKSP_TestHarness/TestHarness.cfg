// TEST ONLY - never leave installed for normal play.
// Install: copy this folder (MKSP_TestHarness) into GameData, launch, load a COPY
// of a career save, stay in the Space Center a few minutes, press F5, then run
//   contracts/tools/check_generation.py <save>/quicksave.sfs KSP.log
// Remove the folder afterwards.
//
// 1. Turns on CC trace logging for every real MKSP_ contract, so KSP.log says
//    why each one is or is not offered under its real requirements.
// 2. Adds a copy of every MKSP_ contract (MKSPT_*) with all requirements removed
//    in a test group with no limits, so CC generates each one and the save shows
//    the generated parameters, waypoints and behaviours.

@CONTRACT_TYPE[MKSP_*]:NEEDS[myKSP_Artemis]:FINAL
{
	%trace = true
}

+CONTRACT_TYPE[MKSP_*]:NEEDS[myKSP_Artemis]:FINAL
{
	@name ^= :^MKSP_:MKSPT_:
	@title ^= :^:[TEST] :
	%group = MKSPT_Test
	%maxSimultaneous = 1
	%trace = true
	!REQUIREMENT,* {}
}

CONTRACT_GROUP:NEEDS[myKSP_Artemis]
{
	name = MKSPT_Test
	displayName = myKSP contract test (remove MKSP_TestHarness)
	agent = Artemis Lunar Program
	maxSimultaneous = 99
}
