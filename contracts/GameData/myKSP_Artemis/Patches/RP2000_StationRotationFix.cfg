// Fix for an RP2000 contract that fails to load today:
//   ContractConfigurator.ExpressionRequirement: CONTRACT_TYPE
//   'spaceStationRotationRepeat', REQUIREMENT 'HaveStation' of type
//   'Expression': missing required attribute 'title'.
// Adds the missing title so the station crew rotation contract loads.
// Remove this file if RP2000 ships its own fix.
@CONTRACT_TYPE[spaceStationRotationRepeat]:NEEDS[RP2000]
{
	@REQUIREMENT[HaveStation]
	{
		%title = Have an uncrewed space station in orbit
	}
}
