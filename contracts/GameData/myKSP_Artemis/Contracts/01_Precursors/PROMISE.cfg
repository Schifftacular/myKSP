// Manifest id: PROMISE (late 2028; NASA/JPL rover delivered by Blue Origin Blue Moon MK1).
// First nuclear-powered rover of the Moon Base. The manifest dependency
// NEW-GLENN-RTF is a world event, so it is not a contract gate: the real slip
// is carried by the optional historical-cadence window instead.
// Checks use the generator module (RTG stand-in), not specific part names.
CONTRACT_TYPE
{
	name = MKSP_Precursor_PROMISE
	group = MKSP_Precursors
	title = Nuclear Polar Prospecting Rover
	description = Solar rovers die in the long polar night. Land an uncrewed, wheeled rover with a nuclear (RTG or reactor stand-in) power source at the lunar South Pole, keep it alive and working for 30 days, and return surface science from the polar terrain. This is the long-duration prospector that tells the Moon Base where to dig.
	synopsis = Land a nuclear-powered rover at the South Pole and keep it working for 30 days.
	completedMessage = The rover is still driving after a full month, through shadow that would have killed a solar design. The volatile map now covers real ground.
	notes = Real-world analogue: NASA PROMISE (JPL rover on Blue Origin Blue Moon MK1, about 18-month mission). Any uncrewed wheeled vessel with a generator module qualifies.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 180000
	rewardFunds = 220000
	rewardReputation = 50
	failureFunds = 180000
	failureReputation = 20

	REQUIREMENT
	{
		name = ViperDone
		type = CompleteContract
		contractType = MKSP_Precursor_VIPER
		title = Complete the South Pole Ice Prospecting Rover
	}

	PARAMETER
	{
		name = Rover
		type = VesselParameterGroup
		title = Nuclear-powered rover working for 30 days
		duration = 30d

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Wheels
			type = Any
			title = Has rover wheels
			hideChildren = true
			PARAMETER
			{
				name = KSPWheels
				type = PartValidation
				partModule = KSPWheelBase
				minCount = 1
			}
			PARAMETER
			{
				name = StockWheels
				type = PartValidation
				partModule = ModuleWheelBase
				minCount = 1
			}
		}
		PARAMETER
		{
			name = NuclearPower
			type = PartValidation
			partModule = ModuleGenerator
			minCount = 1
			title = Has a nuclear (RTG or reactor) power source
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			biome = South Pole
			situation = LANDED
			title = Landed in the South Pole region
		}
		PARAMETER
		{
			name = Powered
			type = HasResource
			resource = ElectricCharge
			minQuantity = 1
			title = Never runs out of electric charge
		}
	}
	PARAMETER
	{
		name = PolarSurfaceScience
		type = CollectScience
		targetBody = Moon
		biome = South Pole
		situation = SrfLanded
		recoveryMethod = RecoverOrTransmit
		title = Return surface science from the South Pole region
	}
}
