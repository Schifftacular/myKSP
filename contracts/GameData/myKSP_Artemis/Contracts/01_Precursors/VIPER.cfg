// Manifest id: VIPER (late 2027).
// Waypoints approximate a short traverse near Mons Mouton; RSS terrain is
// coarser than LOLA so these are flavour positions, not surveyed sites.
CONTRACT_TYPE
{
	name = MKSP_Precursor_VIPER
	group = MKSP_Precursors
	title = South Pole Ice Prospecting Rover
	description = Water ice is what makes a permanent base affordable. Land an uncrewed rover in the lunar South Pole region, drive a three-stop prospecting traverse near Mons Mouton, and transmit surface science from the polar terrain.
	synopsis = Drive an uncrewed rover through three south-pole waypoints.
	completedMessage = The rover's neutron spectrometer data show hydrogen enrichment along the traverse. The ice map just got real.
	notes = Real-world analogue: VIPER. Any wheeled, uncrewed vessel qualifies.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 80000
	rewardFunds = 240000
	rewardReputation = 45
	failureFunds = 80000
	failureReputation = 20

	REQUIREMENT
	{
		name = MoonLandingDone
		type = CompleteContract
		contractType = landingMoon
		title = Complete an uncrewed Moon landing
	}
	REQUIREMENT
	{
		name = MapperDone
		type = CompleteContract
		contractType = MKSP_Precursor_PolarMapper
		title = Complete the Lunar Polar Mapping Orbiter
	}

	BEHAVIOUR
	{
		name = ViperSites
		type = WaypointGenerator
		WAYPOINT
		{
			name = VIPER Stop 1 - Mons Mouton
			icon = sample
			targetBody = Moon
			latitude = -84.60
			longitude = 29.00
		}
		WAYPOINT
		{
			name = VIPER Stop 2 - Upper slope
			icon = sample
			targetBody = Moon
			latitude = -84.63
			longitude = 29.40
		}
		WAYPOINT
		{
			name = VIPER Stop 3 - Shadowed margin
			icon = sample
			targetBody = Moon
			latitude = -84.66
			longitude = 28.60
		}
	}

	PARAMETER
	{
		name = Rover
		type = VesselParameterGroup
		title = Uncrewed rover traverse
		define = mkspViper

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			maxCrew = 0
		}
		PARAMETER
		{
			name = Wheels
			type = Any
			title = Has rover wheels
			hideChildren = true
			PARAMETER
			{
				name = KSPWheels
				type = PartValidation
				partModule = KSPWheelBase
				minCount = 1
			}
			PARAMETER
			{
				name = StockWheels
				type = PartValidation
				partModule = ModuleWheelBase
				minCount = 1
			}
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			biome = South Pole
			situation = LANDED
			disableOnStateChange = true
			title = Land in the South Pole region
		}
		PARAMETER
		{
			name = Stop1
			type = VisitWaypoint
			disableOnStateChange = true
			index = 0
			horizontalDistance = 300
			completeInSequence = true
		}
		PARAMETER
		{
			name = Stop2
			type = VisitWaypoint
			disableOnStateChange = true
			index = 1
			horizontalDistance = 300
			completeInSequence = true
		}
		PARAMETER
		{
			name = Stop3
			type = VisitWaypoint
			disableOnStateChange = true
			index = 2
			horizontalDistance = 300
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = PolarSurfaceScience
		type = CollectScience
		targetBody = Moon
		biome = South Pole
		situation = SrfLanded
		recoveryMethod = RecoverOrTransmit
		title = Return surface science from the South Pole region
	}
}
