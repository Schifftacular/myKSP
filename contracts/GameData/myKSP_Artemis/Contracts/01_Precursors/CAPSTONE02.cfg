// Manifest id: CAPSTONE-02 (2027) - lunar-orbit proximity operations smallsat.
CONTRACT_TYPE
{
	name = MKSP_Precursor_CAPSTONE02
	group = MKSP_Precursors
	title = Lunar Proximity Operations Smallsat
	description = Every Artemis landing now starts with Orion meeting a lander in lunar orbit, with no Gateway to hide behind. Fly a sub-tonne smallsat into lunar orbit and bring it within 200 m of another uncrewed spacecraft there to prove low-cost proximity operations.
	synopsis = Rendezvous a sub-tonne smallsat with another spacecraft in lunar orbit.
	completedMessage = Proximity operations demonstrated. Navigation teams now have real relative-tracking data for crewed lunar-orbit rendezvous.
	notes = Real-world analogue: CAPSTONE 02. The target can be any other uncrewed vessel in lunar orbit, including a relay or a released target.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1095
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 70000
	rewardFunds = 90000
	rewardReputation = 25
	failureFunds = 70000
	failureReputation = 10

	REQUIREMENT
	{
		name = MapperDone
		type = CompleteContract
		contractType = MKSP_Precursor_PolarMapper
		title = Complete the Lunar Polar Mapping Orbiter
	}

	PARAMETER
	{
		name = Smallsat
		type = VesselParameterGroup
		title = Sub-tonne smallsat in lunar orbit
		define = mkspCapstone02

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Small
			type = VesselMass
			maxMass = 1.0
			title = Spacecraft mass under 1 t
		}
		PARAMETER
		{
			name = LunarOrbit
			type = Orbit
			targetBody = Moon
			minPeA = 15000
			title = Stable lunar orbit (periapsis above 15 km)
		}
	}
	PARAMETER
	{
		name = Target
		type = VesselParameterGroup
		title = Rendezvous target: another uncrewed spacecraft in lunar orbit
		define = mkspCapstone02Target
		completeInSequence = true

		PARAMETER
		{
			name = NotSmallsat
			type = IsNotVessel
			vessel = mkspCapstone02
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = InLunarOrbit
			type = Orbit
			targetBody = Moon
			minPeA = 15000
		}
		PARAMETER
		{
			name = Proximity
			type = Rendezvous
			vessel = mkspCapstone02
			distance = 200
			title = Within 200 m of the smallsat
		}
	}
}
