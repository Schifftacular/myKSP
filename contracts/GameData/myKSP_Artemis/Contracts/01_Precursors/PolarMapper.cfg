// Manifest id: none (pre-2026 heritage: Lunar Reconnaissance Orbiter, 2009-present).
// Foundation contract that unlocks the Artemis tree.
CONTRACT_TYPE
{
	name = MKSP_Precursor_PolarMapper
	group = MKSP_Precursors
	title = Lunar Polar Mapping Orbiter
	description = Every Artemis landing site was chosen from orbital maps. Put an uncrewed mapper in a low, near-polar lunar orbit that overflies both poles, hold that orbit for a month, and return science from low lunar orbit. This is the LRO-class survey the south pole campaign is built on.
	synopsis = Map the lunar poles from a low polar orbit.
	completedMessage = Polar mosaics are in. The site selection team finally has illumination and slope maps of the south pole.
	notes = Real-world analogue: Lunar Reconnaissance Orbiter.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1095
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 60000
	rewardFunds = 140000
	rewardReputation = 30
	failureFunds = 60000
	failureReputation = 15

	REQUIREMENT
	{
		name = MoonOrbitDone
		type = CompleteContract
		contractType = MoonOrbitUncrewed
		title = Complete an uncrewed lunar orbit mission
	}

	PARAMETER
	{
		name = Mapper
		type = VesselParameterGroup
		title = Uncrewed mapper in a low polar lunar orbit for 30 days
		define = mkspPolarMapper
		duration = 30d

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			maxCrew = 0
		}
		PARAMETER
		{
			name = PolarOrbit
			type = Orbit
			targetBody = Moon
			minInclination = 85
			maxInclination = 95
			minPeA = 20000
			maxApA = 250000
			title = Lunar orbit: inclination 85-95 deg, periapsis above 20 km, apoapsis below 250 km
		}
	}
	PARAMETER
	{
		name = PolarScience
		type = CollectScience
		targetBody = Moon
		situation = InSpaceLow
		recoveryMethod = RecoverOrTransmit
		title = Return science from low lunar orbit
	}
}
