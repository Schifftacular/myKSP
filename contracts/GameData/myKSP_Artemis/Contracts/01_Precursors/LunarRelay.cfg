// Manifest ids: MOON-BASE-III (relay deployment), BLUE-GHOST-M2 (far-side comms need).
// Models: ESA Lunar Pathfinder, ESA Moonlight, Intuitive Machines data-relay
// satellites, NASA LunaNet. With RealAntennas installed the far side and
// polar craters genuinely have no line of sight to Earth without these.
CONTRACT_TYPE
{
	name = MKSP_Precursor_LunarRelay
	group = MKSP_Precursors
	title = Lunar Communications Relay
	description = The south pole spends long stretches with Earth below the horizon, and the far side never sees it. Place an uncrewed relay satellite with at least two antennas (one for the Earth trunk, one for the surface) in an inclined, elliptical lunar orbit and keep it there for 30 days. Up to three relays will be funded to build a LunaNet-style constellation.
	synopsis = Put a dual-antenna relay into an inclined, elliptical lunar orbit.
	completedMessage = Relay is on station. Ground stations confirm a link through to the lunar surface.
	notes = Real-world analogues: ESA Lunar Pathfinder, ESA Moonlight, NASA LunaNet. Repeatable up to three times.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1095
	maxCompletions = 3
	maxSimultaneous = 1

	advanceFunds = 35000
	rewardFunds = 90000
	rewardReputation = 15
	failureFunds = 35000
	failureReputation = 10

	REQUIREMENT
	{
		name = MapperDone
		type = CompleteContract
		contractType = MKSP_Precursor_PolarMapper
		title = Complete the Lunar Polar Mapping Orbiter
	}

	PARAMETER
	{
		name = Relay
		type = VesselParameterGroup
		title = Uncrewed relay on station for 30 days
		duration = 30d

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			maxCrew = 0
		}
		PARAMETER
		{
			name = TwoAntennas
			type = PartValidation
			partModule = ModuleRealAntenna
			minCount = 2
			title = At least two antenna-carrying parts
		}
		PARAMETER
		{
			name = RelayOrbit
			type = Orbit
			targetBody = Moon
			minInclination = 50
			maxInclination = 130
			minApA = 5000000
			minPeA = 300000
			title = Lunar orbit: inclination 50-130 deg, apoapsis above 5,000 km, periapsis above 300 km
		}
	}
}
