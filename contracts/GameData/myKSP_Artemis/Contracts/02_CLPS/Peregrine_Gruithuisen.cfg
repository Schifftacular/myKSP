// Manifest ids: PEREGRINE-2, PEREGRINE-3 (by end of 2028), BLUE-GHOST-M3 (2028).
// Repeatable twice so both Peregrine landings can be flown.
CONTRACT_TYPE
{
	name = MKSP_CLPS_Gruithuisen
	group = MKSP_CLPS
	title = Gruithuisen Domes Science Lander
	description = The Gruithuisen Domes are silica-rich volcanic domes unlike anything else on the near side. Land an uncrewed science lander within 5 km of Gruithuisen Gamma and keep it operating on the surface for 14 days so its radiation and composition instruments can complete a full lunar daylight period.
	synopsis = Land within 5 km of Gruithuisen Gamma and operate for 14 days.
	completedMessage = Two weeks of surface data from the domes. The volcanologists have a lot to argue about.
	notes = Real-world analogues: Peregrine Missions Two and Three, Blue Ghost Mission 3. Repeatable twice.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 2
	maxSimultaneous = 1

	advanceFunds = 110000
	rewardFunds = 130000
	rewardReputation = 30
	failureFunds = 110000
	failureReputation = 15

	REQUIREMENT
	{
		name = MoonLandingDone
		type = CompleteContract
		contractType = landingMoon
		title = Complete an uncrewed Moon landing
	}

	BEHAVIOUR
	{
		name = DomeSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Gruithuisen Gamma
			icon = marker
			targetBody = Moon
			latitude = 36.6
			longitude = -40.7
		}
	}

	PARAMETER
	{
		name = Lander
		type = VesselParameterGroup
		title = Uncrewed lander operating at the domes for 14 days
		duration = 14d

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtDomes
			type = VisitWaypoint
			index = 0
			horizontalDistance = 5000
			title = Within 5 km of Gruithuisen Gamma
		}
		PARAMETER
		{
			name = Powered
			type = HasResource
			resource = ElectricCharge
			minQuantity = 1
			title = Stays powered
		}
	}
}
