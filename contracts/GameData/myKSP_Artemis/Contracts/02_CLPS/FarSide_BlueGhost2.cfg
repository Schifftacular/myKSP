// Manifest id: BLUE-GHOST-M2 (2027) - first American far-side landing.
// RealAntennas means the far side has no direct Earth link: a lunar relay
// contract is a prerequisite, and you will need that relay in practice.
CONTRACT_TYPE
{
	name = MKSP_CLPS_FarSide
	group = MKSP_CLPS
	title = Far-Side Landing via Lunar Relay
	description = The far side is radio-quiet and scientifically priceless, and it never sees Earth. Land an uncrewed science lander in the South Pole-Aitken basin and return surface science through your lunar relay network.
	synopsis = Land uncrewed in the Aitken Basin and return surface science.
	completedMessage = First data from the far side are flowing through the relay. Radio astronomers are thrilled.
	notes = Real-world analogue: Blue Ghost Mission 2. Requires a working relay because RealAntennas enforces line of sight.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 150000
	rewardFunds = 180000
	rewardReputation = 45
	failureFunds = 150000
	failureReputation = 20

	REQUIREMENT
	{
		name = RelayDone
		type = CompleteContract
		contractType = MKSP_Precursor_LunarRelay
		title = Have at least one lunar relay on station
	}
	REQUIREMENT
	{
		name = MoonLandingDone
		type = CompleteContract
		contractType = landingMoon
		title = Complete an uncrewed Moon landing
	}

	PARAMETER
	{
		name = Lander
		type = VesselParameterGroup
		title = Uncrewed lander on the far side

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			biome = Aitken Basin
			situation = LANDED
			disableOnStateChange = true
			title = Land in the Aitken Basin
		}
	}
	PARAMETER
	{
		name = FarSideScience
		type = CollectScience
		targetBody = Moon
		biome = Aitken Basin
		situation = SrfLanded
		recoveryMethod = Transmit
		title = Transmit surface science from the Aitken Basin
	}
}
