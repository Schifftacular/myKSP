// Manifest ids: LID-1, LID-2, LID-3 (HALO-derived Lunar Infrastructure Demos,
// Phase 1, through 2029). Repeatable three times; each node must ride out a
// full lunar day/night cycle (~29.5 days) without losing power.
CONTRACT_TYPE
{
	name = MKSP_LID_Node
	group = MKSP_CLPS
	title = Lunar Infrastructure Demo Node
	description = With Gateway paused, its HALO hardware is being reborn as surface infrastructure. Land an uncrewed utility node within 5 km of the base site and keep it powered through a full lunar day-night cycle. Three nodes will be funded to form the base's first power and comms backbone.
	synopsis = Land a utility node near the base site and keep it powered for 30 days.
	completedMessage = The node rode out the lunar night with power to spare.
	notes = Real-world analogue: Lunar Infrastructure Demos (LID-1 to LID-3). Needs a power source and enough storage (or an RTG/reactor) to stay above zero charge through the night. Repeatable three times.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 3
	maxSimultaneous = 1

	advanceFunds = 80000
	rewardFunds = 220000
	rewardReputation = 30
	failureFunds = 80000
	failureReputation = 15

	REQUIREMENT
	{
		name = MoonBase1Done
		type = CompleteContract
		contractType = MKSP_MoonBase1_Endurance
		title = Complete Moon Base I
	}

	BEHAVIOUR
	{
		name = BaseSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.45
			longitude = -137.5
		}
	}

	PARAMETER
	{
		name = Node
		type = VesselParameterGroup
		title = Uncrewed node powered at the base site for 30 days
		duration = 30d

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtSite
			type = VisitWaypoint
			index = 0
			horizontalDistance = 5000
			title = Within 5 km of the base site
		}
		PARAMETER
		{
			name = PowerSource
			type = Any
			title = Has a power source (solar, RTG or fuel cell)
			hideChildren = true
			PARAMETER
			{
				name = Solar
				type = PartValidation
				partModule = ModuleDeployableSolarPanel
				minCount = 1
			}
			PARAMETER
			{
				name = ROSolar
				type = PartValidation
				partModule = ModuleROSolar
				minCount = 1
			}
			PARAMETER
			{
				name = Generator
				type = PartValidation
				partModule = ModuleGenerator
				minCount = 1
			}
		}
		PARAMETER
		{
			name = Powered
			type = HasResource
			resource = ElectricCharge
			minQuantity = 1
			title = Never runs out of electric charge
		}
	}
}
