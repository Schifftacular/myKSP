// Manifest id: MOON-BASE-III (Intuitive Machines IM-3 "Trinity", late 2026 / early 2027).
CONTRACT_TYPE
{
	name = MKSP_MoonBase3_ReinerGamma
	group = MKSP_CLPS
	title = Moon Base III: Reiner Gamma Swirl and Relay
	description = The Reiner Gamma swirl is a bright magnetic anomaly in Oceanus Procellarum that may protect the surface from the solar wind. Land an uncrewed science lander within 5 km of it, return surface science from Oceanus Procellarum, and release a small relay satellite into lunar orbit for the growing surface comms network.
	synopsis = Land at Reiner Gamma, return surface science, and put a relay into lunar orbit.
	completedMessage = Magnetometer data from the swirl are in, and the relay is broadcasting.
	notes = Real-world analogue: IM-3. The relay must be a separate uncrewed vessel in lunar orbit with an antenna.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 125000
	rewardFunds = 155000
	rewardReputation = 35
	failureFunds = 125000
	failureReputation = 15

	REQUIREMENT
	{
		name = MoonLandingDone
		type = CompleteContract
		contractType = landingMoon
		title = Complete an uncrewed Moon landing
	}

	BEHAVIOUR
	{
		name = SwirlSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Reiner Gamma Swirl
			icon = marker
			targetBody = Moon
			latitude = 7.5
			longitude = -59.0
		}
	}

	PARAMETER
	{
		name = Lander
		type = VesselParameterGroup
		title = Uncrewed lander at Reiner Gamma
		define = mkspIM3Lander

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			disableOnStateChange = true
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtSwirl
			type = VisitWaypoint
			index = 0
			horizontalDistance = 5000
			title = Within 5 km of Reiner Gamma
		}
	}
	PARAMETER
	{
		name = SwirlScience
		type = CollectScience
		targetBody = Moon
		biome = Oceanus Procellarum
		situation = SrfLanded
		recoveryMethod = RecoverOrTransmit
		title = Return surface science from Oceanus Procellarum
	}
	PARAMETER
	{
		name = Relay
		type = VesselParameterGroup
		title = Relay satellite in lunar orbit

		PARAMETER
		{
			name = NotLander
			type = IsNotVessel
			vessel = mkspIM3Lander
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Antenna
			type = PartValidation
			partModule = ModuleRealAntenna
			minCount = 1
			title = Carries an antenna
		}
		PARAMETER
		{
			name = InOrbit
			type = Orbit
			targetBody = Moon
			minPeA = 30000
			title = Lunar orbit with periapsis above 30 km
		}
	}
}
