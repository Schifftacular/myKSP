// Manifest ids: CLPS-2028-OTHER and program_context.clps_cadence (about ten
// CLPS deliveries a year from 2027). Evergreen repeatable delivery to a random
// lunar site, so the robotic program never runs dry.
CONTRACT_TYPE
{
	name = MKSP_CLPS_Delivery
	group = MKSP_CLPS
	title = CLPS Task Order: Science Delivery
	description = NASA's Commercial Lunar Payload Services program buys rides to the Moon by the task order. This one needs an instrument package landed within 3 km of the marked site, with surface science returned from the landing biome.
	synopsis = Land an uncrewed payload within 3 km of the marked site and return surface science.
	completedMessage = Payload delivered and reporting. Another task order closed on time, which is rarer than it should be.
	notes = Repeatable. The landing site is chosen at random when the contract is offered.

	targetBody = Moon
	prestige = Trivial
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 30
	deadline = 730
	maxCompletions = 0
	maxSimultaneous = 1

	advanceFunds = 40000
	rewardFunds = 110000
	rewardReputation = 12
	failureFunds = 40000
	failureReputation = 10

	REQUIREMENT
	{
		name = MoonLandingDone
		type = CompleteContract
		contractType = landingMoon
		title = Complete an uncrewed Moon landing
	}

	BEHAVIOUR
	{
		name = RandomSite
		type = WaypointGenerator
		RANDOM_WAYPOINT
		{
			name = CLPS Delivery Site
			icon = marker
			targetBody = Moon
			waterAllowed = false
		}
	}

	PARAMETER
	{
		name = Lander
		type = VesselParameterGroup
		title = Uncrewed payload at the delivery site

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtSite
			type = VisitWaypoint
			index = 0
			horizontalDistance = 3000
			title = Within 3 km of the delivery site
		}
	}
	PARAMETER
	{
		name = SurfaceScience
		type = CollectScience
		targetBody = Moon
		situation = SrfLanded
		recoveryMethod = RecoverOrTransmit
		title = Return surface science from the Moon
	}
}
