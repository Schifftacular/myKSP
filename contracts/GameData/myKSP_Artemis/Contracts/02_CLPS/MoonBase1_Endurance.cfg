// Manifest id: MOON-BASE-I (Blue Moon MK1 "Endurance", slipped to 2027; needs New Glenn).
// The base site used across the tree is the Shackleton connecting ridge.
// Base anchor: manifest site SP-CONNECTING-RIDGE (-89.5, -135.5, medium precision, v2).
CONTRACT_TYPE
{
	name = MKSP_MoonBase1_Endurance
	group = MKSP_CLPS
	title = Moon Base I: Cargo Lander to Shackleton Ridge
	description = NASA's Moon Base program starts with a commercial cargo lander on the Shackleton connecting ridge, the site the whole base will grow around. Land an uncrewed cargo lander within 3 km of the base site. Bonus if you return descent science over the South Pole region, standing in for the plume-surface interaction imaging later crew landings depend on.
	synopsis = Land an uncrewed cargo lander within 3 km of the Shackleton ridge base site.
	completedMessage = Touchdown on the ridge. The first piece of the Moon Base is on the surface.
	notes = Real-world analogue: Blue Moon MK1 "Endurance". Base site: approx. 89.45 S, 137.5 W.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 160000
	rewardFunds = 190000
	rewardReputation = 45
	failureFunds = 160000
	failureReputation = 20

	REQUIREMENT
	{
		name = MoonLandingDone
		type = CompleteContract
		contractType = landingMoon
		title = Complete an uncrewed Moon landing
	}
	REQUIREMENT
	{
		name = MapperDone
		type = CompleteContract
		contractType = MKSP_Precursor_PolarMapper
		title = Complete the Lunar Polar Mapping Orbiter
	}

	BEHAVIOUR
	{
		name = BaseSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.5
			longitude = -135.5
		}
	}

	PARAMETER
	{
		name = CargoLander
		type = VesselParameterGroup
		title = Uncrewed cargo lander at the base site
		define = mkspMoonBase1

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtSite
			type = VisitWaypoint
			index = 0
			horizontalDistance = 3000
			title = Within 3 km of the base site
		}
	}
	PARAMETER
	{
		name = DescentScience
		type = CollectScience
		targetBody = Moon
		biome = South Pole
		situation = InSpaceLow
		recoveryMethod = RecoverOrTransmit
		optional = true
		rewardFunds = 30000
		title = Bonus: return descent science over the South Pole region
	}
}
