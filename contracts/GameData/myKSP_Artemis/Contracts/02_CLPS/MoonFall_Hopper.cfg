// Manifest id: MOONFALL (2028) - hopping drones scouting south-pole landing sites.
CONTRACT_TYPE
{
	name = MKSP_CLPS_MoonFall
	group = MKSP_CLPS
	title = MoonFall: Hopping Site Scout
	description = Before crews land near the base, we want eyes on the ground at the sites orbital maps can't resolve. Land an uncrewed hopper in the South Pole region and use its engine to hop between three scouting points a few kilometres apart near the base site, landing at the end.
	synopsis = Hop an uncrewed lander between three scouting points near the base site.
	completedMessage = Scout imagery of the approach corridor is in. The crew landing ellipse just got a lot safer.
	notes = Real-world analogue: MoonFall hopping drones. Any uncrewed vessel that visits all three points in order counts.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 120000
	rewardFunds = 150000
	rewardReputation = 35
	failureFunds = 120000
	failureReputation = 15

	REQUIREMENT
	{
		name = MoonBase1Done
		type = CompleteContract
		contractType = MKSP_MoonBase1_Endurance
		title = Complete Moon Base I
	}

	BEHAVIOUR
	{
		name = ScoutPoints
		type = WaypointGenerator
		WAYPOINT
		{
			name = Scout Point Alpha
			icon = marker
			targetBody = Moon
			latitude = -89.40
			longitude = -150.0
		}
		WAYPOINT
		{
			name = Scout Point Bravo
			icon = marker
			targetBody = Moon
			latitude = -89.35
			longitude = -137.5
		}
		WAYPOINT
		{
			name = Scout Point Charlie
			icon = marker
			targetBody = Moon
			latitude = -89.40
			longitude = -125.0
		}
	}

	PARAMETER
	{
		name = Hopper
		type = VesselParameterGroup
		title = Uncrewed hopper

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = FirstLanding
			type = ReachState
			targetBody = Moon
			biome = South Pole
			situation = LANDED
			disableOnStateChange = true
			title = Land in the South Pole region
		}
		PARAMETER
		{
			name = Alpha
			type = VisitWaypoint
			disableOnStateChange = true
			index = 0
			horizontalDistance = 250
			completeInSequence = true
		}
		PARAMETER
		{
			name = Bravo
			type = VisitWaypoint
			disableOnStateChange = true
			index = 1
			horizontalDistance = 250
			completeInSequence = true
		}
		PARAMETER
		{
			name = Charlie
			type = VisitWaypoint
			disableOnStateChange = true
			index = 2
			horizontalDistance = 250
			completeInSequence = true
		}
		PARAMETER
		{
			name = FinalLanding
			type = ReachState
			targetBody = Moon
			situation = LANDED
			completeInSequence = true
			title = Land after the last hop
		}
	}
}
