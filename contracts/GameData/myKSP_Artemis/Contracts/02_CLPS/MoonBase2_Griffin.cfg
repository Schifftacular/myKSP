// Manifest id: MOON-BASE-II (Astrobotic Griffin-1 with a commercial rover, now NET January 2027).
CONTRACT_TYPE
{
	name = MKSP_MoonBase2_Griffin
	group = MKSP_CLPS
	title = Moon Base II: Lander with Deployable Rover
	description = Crew rovers are only as good as what we know about driving on polar regolith. Land an uncrewed lander in the South Pole region, deploy a separate uncrewed rover from it, and drive the rover to a survey point about a kilometre away.
	synopsis = Land in the South Pole region, deploy a rover and drive it about 1 km.
	completedMessage = The rover has made it across. Mobility data from this drive feeds straight into the Lunar Terrain Vehicle program.
	notes = Real-world analogue: Griffin Mission 1. The rover must be a separate vessel from the lander.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 140000
	rewardFunds = 170000
	rewardReputation = 40
	failureFunds = 140000
	failureReputation = 20

	REQUIREMENT
	{
		name = MoonLandingDone
		type = CompleteContract
		contractType = landingMoon
		title = Complete an uncrewed Moon landing
	}

	BEHAVIOUR
	{
		name = GriffinSites
		type = WaypointGenerator
		WAYPOINT
		{
			name = Griffin Landing Zone
			icon = marker
			targetBody = Moon
			latitude = -85.28
			longitude = 53.27
		}
		WAYPOINT
		{
			name = Rover Survey Point
			icon = sample
			targetBody = Moon
			latitude = -85.25
			longitude = 53.67
		}
	}

	PARAMETER
	{
		name = Lander
		type = VesselParameterGroup
		title = Uncrewed lander in the landing zone
		define = mkspGriffinLander

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			biome = South Pole
			situation = LANDED
			disableOnStateChange = true
			title = Land in the South Pole region
		}
		PARAMETER
		{
			name = InZone
			type = VisitWaypoint
			index = 0
			horizontalDistance = 3000
			title = Within 3 km of the landing zone
		}
	}
	PARAMETER
	{
		name = Rover
		type = VesselParameterGroup
		title = Deployed rover reaches the survey point
		completeInSequence = true

		PARAMETER
		{
			name = NotLander
			type = IsNotVessel
			vessel = mkspGriffinLander
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Wheels
			type = Any
			title = Has rover wheels
			hideChildren = true
			PARAMETER
			{
				name = KSPWheels
				type = PartValidation
				partModule = KSPWheelBase
				minCount = 1
			}
			PARAMETER
			{
				name = StockWheels
				type = PartValidation
				partModule = ModuleWheelBase
				minCount = 1
			}
		}
		PARAMETER
		{
			name = Drive
			type = VisitWaypoint
			index = 1
			horizontalDistance = 150
			title = Drive to within 150 m of the survey point
		}
	}
}
