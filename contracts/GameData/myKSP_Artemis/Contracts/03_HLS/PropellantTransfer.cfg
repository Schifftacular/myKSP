// Manifest id: STARSHIP-PROP-TRANSFER-DEMO (early 2027).
// Proven by a nearly empty depot that ends up holding 20,000 L of LOX after a
// docking. RealFuels boil-off makes loiter time a real cost.
CONTRACT_TYPE
{
	name = MKSP_HLS_PropellantTransfer
	group = MKSP_HLS
	title = HLS Orbital Propellant Transfer Demo
	description = No lunar lander reaches the Moon without refuelling in orbit. Put a nearly empty depot into Earth orbit, dock a tanker to it, and transfer cryogenic propellant until the depot holds at least 20,000 L of liquid oxygen. Boil-off is real: don't loiter.
	synopsis = Dock a tanker to a near-empty depot in Earth orbit and fill it with 20,000 L of LOX.
	completedMessage = Cryogenic transfer at scale is proven. The lander providers can now plan real refuelling campaigns.
	notes = Real-world analogue: Starship ship-to-ship propellant transfer demo. 20,000 L of LqdOxygen is about 23 t.

	targetBody = Earth
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1095
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 100000
	rewardFunds = 300000
	rewardReputation = 40
	failureFunds = 100000
	failureReputation = 20

	REQUIREMENT
	{
		name = DockingDone
		type = CompleteContract
		contractType = first_Docking
		title = Complete the first docking milestone
	}

	PARAMETER
	{
		name = Depot
		type = VesselParameterGroup
		title = Depot in Earth orbit
		define = mkspPropDepot

		PARAMETER
		{
			name = InOrbit
			type = Orbit
			disableOnStateChange = true
			targetBody = Earth
			minPeA = 150000
			title = Earth orbit with periapsis above 150 km
		}
		PARAMETER
		{
			name = NearlyEmpty
			type = HasResource
			resource = LqdOxygen
			maxQuantity = 1000
			disableOnStateChange = true
			title = At some point in orbit, holds 1,000 L of LOX or less
		}
		PARAMETER
		{
			name = TankerDocks
			type = Docking
			completeInSequence = true
			title = A tanker docks with the depot
		}
		PARAMETER
		{
			name = Filled
			type = HasResource
			resource = LqdOxygen
			minQuantity = 20000
			completeInSequence = true
			title = Depot (or depot plus docked tanker) holds 20,000 L of LOX
		}
	}
}
