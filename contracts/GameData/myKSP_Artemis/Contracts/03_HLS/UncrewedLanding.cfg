// Manifest ids: STARSHIP-HLS-UNCREWED-LANDING (late 2027),
// BLUE-MOON-MK2-UNCREWED-LANDING (before its first crewed landing).
// Each provider must fly one uncrewed landing first, so this is repeatable twice.
CONTRACT_TYPE
{
	name = MKSP_HLS_UncrewedLanding
	group = MKSP_HLS
	title = HLS Uncrewed Lunar Landing Demo
	description = Before NASA puts astronauts in a lander, that lander has to prove it can do the whole job empty. Land a crew-rated lander (cabin for at least two) uncrewed in the South Pole region, then lift off again and reach lunar orbit. Land within 500 m of the base site for an accuracy bonus.
	synopsis = Land a crew-rated lander uncrewed at the south pole and return it to lunar orbit.
	completedMessage = Landing and ascent demonstrated. This lander is cleared for crew.
	notes = Real-world analogues: Starship HLS and Blue Moon MK2 uncrewed demos. Repeatable twice, once per lander provider.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 2
	maxSimultaneous = 1

	advanceFunds = 200000
	rewardFunds = 550000
	rewardReputation = 60
	failureFunds = 200000
	failureReputation = 30

	REQUIREMENT
	{
		name = PropTransferDone
		type = CompleteContract
		contractType = MKSP_HLS_PropellantTransfer
		title = Complete the HLS propellant transfer demo
	}
	REQUIREMENT
	{
		name = MoonLandingDone
		type = CompleteContract
		contractType = landingMoon
		title = Complete an uncrewed Moon landing
	}

	BEHAVIOUR
	{
		name = BaseSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.45
			longitude = -137.5
		}
	}

	PARAMETER
	{
		name = Lander
		type = VesselParameterGroup
		title = Uncrewed crew-rated lander lands at the south pole
		define = mkspHLSDemo

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = CrewRated
			type = HasCrewCapacity
			minCapacity = 2
			title = Cabin for at least two crew
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			biome = South Pole
			situation = LANDED
			title = Land in the South Pole region
		}
	}
	PARAMETER
	{
		name = AscentLeg
		type = VesselParameterGroup
		vessel = mkspHLSDemo
		completeInSequence = true
		title = The same lander lifts off and reaches lunar orbit

		PARAMETER
		{
			name = Ascent
			type = Orbit
			targetBody = Moon
			minPeA = 15000
			title = Lunar orbit with periapsis above 15 km
		}
	}
	PARAMETER
	{
		name = PrecisionBonus
		type = VesselParameterGroup
		vessel = mkspHLSDemo
		optional = true
		rewardFunds = 75000
		title = Bonus: the lander touches down within 500 m of the base site

		PARAMETER
		{
			name = LandedHere
			type = ReachState
			targetBody = Moon
			situation = LANDED
		}
		PARAMETER
		{
			name = Precision
			type = VisitWaypoint
			index = 0
			horizontalDistance = 500
		}
	}
}
