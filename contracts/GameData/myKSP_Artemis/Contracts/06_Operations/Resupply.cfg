// Manifest: program_context.clps_cadence (regular commercial deliveries).
// One delivery = 30 days of consumables for four crew at TAC-LS rates.
CONTRACT_TYPE
{
	name = MKSP_Ops_Resupply
	group = MKSP_Operations
	title = Base Resupply Delivery
	description = A base lives on its supply chain. Land an uncrewed cargo lander within 1 km of the base carrying 30 days of consumables for four crew: 175 Food, 116 Water and 17,770 Oxygen.
	synopsis = Deliver 30 crew-days x4 of consumables to within 1 km of the base.
	completedMessage = Cargo is down and the pantry is full for another month.
	notes = Repeatable. Transfer the cargo to the habitat yourself.

	targetBody = Moon
	prestige = Trivial
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 30
	deadline = 365
	maxCompletions = 0
	maxSimultaneous = 1

	advanceFunds = 180000
	rewardFunds = 220000
	rewardReputation = 20
	failureFunds = 180000
	failureReputation = 25

	REQUIREMENT
	{
		name = HabDone
		type = CompleteContract
		contractType = MKSP_Base_Habitat
		title = Land the first surface habitat
	}

	BEHAVIOUR
	{
		name = BaseSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.45
			longitude = -137.5
		}
	}

	PARAMETER
	{
		name = Cargo
		type = VesselParameterGroup
		title = Uncrewed cargo lander at the base

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Food
			type = HasResource
			resource = Food
			minQuantity = 175
			title = At least 175 Food
		}
		PARAMETER
		{
			name = Water
			type = HasResource
			resource = Water
			minQuantity = 116
			title = At least 116 Water
		}
		PARAMETER
		{
			name = Oxygen
			type = HasResource
			resource = Oxygen
			minQuantity = 17770
			title = At least 17,770 Oxygen
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			index = 0
			horizontalDistance = 1000
			title = Within 1 km of the base site
		}
	}
}
