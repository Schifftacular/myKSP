// Manifest: program_context.landing_cadence (crewed landings every ~6-12
// months). Repeatable once the habitat is occupied.
CONTRACT_TYPE
{
	name = MKSP_Ops_CrewRotation
	group = MKSP_Operations
	title = Base Crew Rotation
	description = Routine is the goal. Fly a rotation crew of at least two to within 2 km of the base, bring at least two crew home to Earth in the same vehicle, and leave the habitat staffed with at least two crew when you go.
	synopsis = Land a rotation crew at the base, return a crew home, and leave the base staffed.
	completedMessage = Rotation complete. Fresh crew on the ridge, tired crew home.
	notes = Repeatable. The habitat must still hold two crew after the rotation flight leaves. Fails if anyone dies.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 30
	deadline = 730
	maxCompletions = 0
	maxSimultaneous = 1

	advanceFunds = 430000
	rewardFunds = 520000
	rewardReputation = 50
	failureFunds = 430000
	failureReputation = 40

	REQUIREMENT
	{
		name = Artemis7Done
		type = CompleteContract
		contractType = MKSP_Artemis7
		title = Complete Artemis VII
	}

	BEHAVIOUR
	{
		name = BaseSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.45
			longitude = -137.5
		}
	}

	PARAMETER
	{
		name = Flight
		type = VesselParameterGroup
		title = Rotation flight
		define = mkspRotationFlight

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			title = At least two crew aboard
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			disableOnStateChange = true
			title = Land on the Moon
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			index = 0
			horizontalDistance = 2000
			disableOnStateChange = true
			title = Within 2 km of the base site
		}
		PARAMETER
		{
			name = ComeHome
			type = ReturnHome
			completeInSequence = true
			title = Return safely to Earth
		}
	}
	PARAMETER
	{
		name = BaseStaffed
		type = VesselParameterGroup
		title = Habitat still staffed after the rotation
		completeInSequence = true

		PARAMETER
		{
			name = NotFlight
			type = IsNotVessel
			vessel = mkspRotationFlight
		}
		PARAMETER
		{
			name = Crew
			type = HasCrew
			minCrew = 2
			title = At least two crew aboard
		}
		PARAMETER
		{
			name = Capacity
			type = HasCrewCapacity
			minCapacity = 4
			title = Room for at least four crew
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			index = 0
			horizontalDistance = 1000
			title = Within 1 km of the base site
		}
	}
	PARAMETER
	{
		name = NoLosses
		type = KerbalDeaths
		title = Lose no crew
	}
}
