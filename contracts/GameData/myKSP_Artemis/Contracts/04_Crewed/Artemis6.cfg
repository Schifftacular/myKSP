// Manifest id: ARTEMIS-VI (projected 2029, speculative) - first crew to use base power.
CONTRACT_TYPE
{
	name = MKSP_Artemis6
	group = MKSP_Crewed
	title = Artemis VI: First Week at the Base
	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 720000
	rewardFunds = 880000
	rewardReputation = 150
	failureFunds = 720000
	failureReputation = 80
	description = The base has power now. Land two crew within 1 km of the Shackleton ridge site and keep them living in their lander or a surface module for seven straight days, drawing on the base infrastructure instead of a sortie lander's batteries.
	synopsis = Keep two crew at the base site for seven days.
	completedMessage = A full week at the base. Sorties are over; this is a place people live now.
	notes = Real-world basis: speculative projection of NASA's Moon Base Phase 1/2 cadence. Requires surface power from a LID node or the fission reactor. Fails if anyone dies.

	REQUIREMENT
	{
		name = Artemis5Done
		type = CompleteContract
		contractType = MKSP_Artemis5
		title = Complete Artemis V
	}

	REQUIREMENT
	{
		name = BasePower
		type = Any
		title = Have surface power at the base (a LID node or the fission reactor)
		REQUIREMENT
		{
			name = LIDDone
			type = CompleteContract
			contractType = MKSP_LID_Node
			title = Complete a Lunar Infrastructure Demo node
		}
		REQUIREMENT
		{
			name = FSPDone
			type = CompleteContract
			contractType = MKSP_Base_FissionPower
			title = Bring the fission reactor online
		}
	}

	BEHAVIOUR
	{
		name = BaseSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.5
			longitude = -135.5
		}
	}

	PARAMETER
	{
		name = Stay
		type = VesselParameterGroup
		title = Two crew at the base site for seven days
		duration = 7d

		PARAMETER
		{
			name = Crew
			type = HasCrew
			minCrew = 2
			title = At least 2 crew aboard
		}
		PARAMETER
		{
			name = Capacity
			type = HasCrewCapacity
			minCapacity = 2
			title = Room for at least 2 crew
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			index = 0
			horizontalDistance = 1000
			title = Within 1 km of the base site
		}
	}

	PARAMETER
	{
		name = NoLosses
		type = KerbalDeaths
		title = Lose no crew
	}
}
