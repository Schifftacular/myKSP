// Manifest id: ARTEMIS-III (mid-2027, ~14 days in LEO).
// Two lander test articles launch first; Orion docks with the first (crew
// enters), then the second (docking only), then comes home.
CONTRACT_TYPE
{
	name = MKSP_Artemis3
	group = MKSP_Crewed
	title = Artemis III: Lander Docking Test in Earth Orbit
	description = Before anyone lands, the crew vehicle has to prove it can meet and dock with both commercial landers. Put two uncrewed crew-rated lander test articles into Earth orbit. Launch four crew, dock with the first lander (the real crew float inside for two days), then dock with the second, and return home. The real mission runs about two weeks; the loiter is yours to plan around boil-off.
	synopsis = Dock a four-crew vehicle with two lander test articles in Earth orbit and return.
	completedMessage = Both landers have been docked and checked out with crew. Artemis is cleared to go back to the surface.
	notes = Real-world analogue: Artemis III (Bresnik, Rubio, Douglas, Parmitano) with Blue Moon MK2 and Starship test articles.

	targetBody = Earth
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 200000
	rewardFunds = 600000
	rewardReputation = 100
	failureFunds = 200000
	failureReputation = 50

	REQUIREMENT
	{
		name = Artemis2Done
		type = CompleteContract
		contractType = MKSP_Artemis2
		title = Complete Artemis II
	}
	REQUIREMENT
	{
		name = PropTransferDone
		type = CompleteContract
		contractType = MKSP_HLS_PropellantTransfer
		title = Complete the HLS propellant transfer demo
	}

	PARAMETER
	{
		name = LanderA
		type = VesselParameterGroup
		title = First lander test article in Earth orbit
		define = mkspArtemis3LanderA

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			disableOnStateChange = true
			title = Launched uncrewed
		}
		PARAMETER
		{
			name = CrewRated
			type = HasCrewCapacity
			minCapacity = 2
			title = Cabin for at least two crew
		}
		PARAMETER
		{
			name = InOrbit
			type = Orbit
			targetBody = Earth
			minPeA = 150000
			title = Earth orbit with periapsis above 150 km
		}
	}
	PARAMETER
	{
		name = LanderB
		type = VesselParameterGroup
		title = Second lander test article in Earth orbit
		define = mkspArtemis3LanderB

		PARAMETER
		{
			name = NotLanderA
			type = IsNotVessel
			vessel = mkspArtemis3LanderA
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			disableOnStateChange = true
			title = Launched uncrewed
		}
		PARAMETER
		{
			name = InOrbit
			type = Orbit
			targetBody = Earth
			minPeA = 150000
			title = Earth orbit with periapsis above 150 km
		}
	}
	PARAMETER
	{
		name = Crew
		type = VesselParameterGroup
		title = Crew vehicle with four aboard
		define = mkspArtemis3Crew
		completeInSequence = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = FourCrew
			type = HasCrew
			minCrew = 4
			disableOnStateChange = true
			title = Launch with four crew
		}
		PARAMETER
		{
			name = DockA
			type = Docking
			vessel = mkspArtemis3LanderA
			completeInSequence = true
			title = Dock with the first lander
		}
		PARAMETER
		{
			name = DockB
			type = Docking
			vessel = mkspArtemis3LanderB
			completeInSequence = true
			title = Dock with the second lander
		}
		PARAMETER
		{
			name = ComeHome
			type = ReturnHome
			completeInSequence = true
			title = Return safely to Earth
		}
	}
	PARAMETER
	{
		name = NoLosses
		type = KerbalDeaths
		title = Lose no crew
	}
}
