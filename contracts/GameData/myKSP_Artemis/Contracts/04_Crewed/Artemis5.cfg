// Manifest id: ARTEMIS-V (late 2028) - second landing, first LTV traverse,
// "when NASA is expected to begin building its Moon base".
CONTRACT_TYPE
{
	name = MKSP_Artemis5
	group = MKSP_Crewed
	title = Artemis V: Base Site Landing and LTV Traverse
	description = The second crew lands right at the base site and starts treating it like a workplace. Land two crew within 2 km of the Shackleton ridge site, take the pre-positioned terrain vehicle (or walk) to the survey point about 3 km out and back to the site, stay at least four days, and bring a sample home.
	synopsis = Land two crew at the base site, drive or walk a 3 km survey traverse, stay four days.
	completedMessage = The base site has been walked, driven and sampled. Construction can start.
	notes = Real-world analogue: Artemis V. Any crewed vessel or EVA kerbal can make the traverse. Fails if anyone dies.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 720000
	rewardFunds = 880000
	rewardReputation = 180
	failureFunds = 720000
	failureReputation = 100

	REQUIREMENT
	{
		name = Artemis4Done
		type = CompleteContract
		contractType = MKSP_Artemis4
		title = Complete Artemis IV
	}
	REQUIREMENT
	{
		name = LTVDone
		type = CompleteContract
		contractType = MKSP_LTV_Delivery
		title = Deliver a Lunar Terrain Vehicle
	}

	BEHAVIOUR
	{
		name = Sites
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.45
			longitude = -137.5
		}
		WAYPOINT
		{
			name = Ridge Survey Point
			icon = sample
			targetBody = Moon
			latitude = -89.35
			longitude = -125.0
		}
	}

	PARAMETER
	{
		name = Lander
		type = VesselParameterGroup
		title = Crewed lander at the base site
		define = mkspArtemis5Lander

		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			title = At least two crew aboard
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			disableOnStateChange = true
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			index = 0
			horizontalDistance = 2000
			title = Within 2 km of the base site
		}
	}
	PARAMETER
	{
		name = Traverse
		type = VesselParameterGroup
		title = Crew traverse to the survey point and back

		PARAMETER
		{
			name = Crewed
			type = HasCrew
			minCrew = 1
			title = Crewed (rover or EVA)
		}
		PARAMETER
		{
			name = Out
			type = VisitWaypoint
			disableOnStateChange = true
			index = 1
			horizontalDistance = 150
			title = Reach the survey point
		}
		PARAMETER
		{
			name = Back
			type = VisitWaypoint
			index = 0
			horizontalDistance = 2000
			completeInSequence = true
			title = Return to within 2 km of the base site
		}
	}
	PARAMETER
	{
		name = SurfaceStay
		type = VesselParameterGroup
		vessel = mkspArtemis5Lander
		duration = 4d
		title = Lander stays on the surface for four days

		PARAMETER
		{
			name = StillLanded
			type = ReachState
			targetBody = Moon
			situation = LANDED
		}
	}
	PARAMETER
	{
		name = Sample
		type = CollectScience
		targetBody = Moon
		situation = SrfLanded
		experiment = surfaceSample
		recoveryMethod = Recover
		title = Recover a lunar surface sample on Earth
	}
	PARAMETER
	{
		name = NoLosses
		type = KerbalDeaths
		title = Lose no crew
	}
}
