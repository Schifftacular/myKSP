// Manifest id: ARTEMIS-II (flown 2026-04-01 to 2026-04-10).
CONTRACT_TYPE
{
	name = MKSP_Artemis2
	group = MKSP_Crewed
	title = Artemis II: Crewed Lunar Flyby
	description = Four astronauts, the first humans beyond low Earth orbit in half a century. Launch a crew of four, check the vehicle out in a high Earth orbit (apogee above 60,000 km), then fly around the Moon within 12,000 km of the surface on a free return and bring everyone home.
	synopsis = Fly four crew around the Moon after a high-Earth-orbit checkout, and return.
	completedMessage = Splashdown. Four crew went farther from Earth than anyone since Apollo 13, and they're home.
	notes = Real-world analogue: Artemis II (Wiseman, Glover, Koch, Hansen). Fails if anyone dies.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 200000
	rewardFunds = 650000
	rewardReputation = 120
	failureFunds = 200000
	failureReputation = 60

	REQUIREMENT
	{
		name = Artemis1Done
		type = CompleteContract
		contractType = MKSP_Artemis1
		title = Complete Artemis I
	}

	PARAMETER
	{
		name = Crew
		type = VesselParameterGroup
		title = Crew vehicle with four aboard
		define = mkspArtemis2

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = FourCrew
			type = HasCrew
			minCrew = 4
			title = Four crew aboard
		}
		PARAMETER
		{
			name = HEOCheckout
			type = Orbit
			targetBody = Earth
			minApA = 60000000
			disableOnStateChange = true
			title = High Earth orbit checkout: apogee above 60,000 km
		}
		PARAMETER
		{
			name = LunarFlyby
			type = ReachState
			targetBody = Moon
			maxAltitude = 12000000
			disableOnStateChange = true
			completeInSequence = true
			title = Pass within 12,000 km of the lunar surface
		}
		PARAMETER
		{
			name = ComeHome
			type = ReturnHome
			completeInSequence = true
			title = Return safely to Earth
		}
	}
	PARAMETER
	{
		name = NoLosses
		type = KerbalDeaths
		title = Lose no crew
	}
}
