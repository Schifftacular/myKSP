// Manifest id: none (pre-2026 heritage: Artemis I, Nov-Dec 2022).
// Kept because RP2000 careers start in 2000, so the player still has to qualify
// the crew vehicle. The real distant retrograde orbit lies outside the RSS Moon
// SOI; modelled as a high retrograde lunar orbit.
CONTRACT_TYPE
{
	name = MKSP_Artemis1
	group = MKSP_Crewed
	title = Artemis I: Uncrewed Crew Vehicle Lunar Test
	description = Before anyone rides it, the deep-space crew vehicle has to survive the whole trip empty. Launch an uncrewed capsule with seats for four into a high, retrograde lunar orbit (periapsis above 5,000 km, inclination above 135 degrees), then bring it home through a lunar-return re-entry.
	synopsis = Fly an empty four-seat capsule to a high retrograde lunar orbit and back.
	completedMessage = The heat shield held at lunar-return speed. The crew vehicle is ready for people.
	notes = Real-world analogue: Artemis I. Orion parts (benjee10_orion_*) fit, but any four-seat capsule counts.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 270000
	rewardFunds = 330000
	rewardReputation = 60
	failureFunds = 270000
	failureReputation = 30

	REQUIREMENT
	{
		name = MoonOrbitDone
		type = CompleteContract
		contractType = MoonOrbitUncrewed
		title = Complete an uncrewed lunar orbit mission
	}
	REQUIREMENT
	{
		name = CrewedOrbitDone
		type = CompleteContract
		contractType = first_OrbitCrewed
		title = Complete the first crewed orbit
	}

	PARAMETER
	{
		name = Capsule
		type = VesselParameterGroup
		title = Uncrewed four-seat capsule
		define = mkspArtemis1

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = FourSeats
			type = HasCrewCapacity
			minCapacity = 4
			title = Seats for at least four
		}
		PARAMETER
		{
			name = DistantOrbit
			type = Orbit
			targetBody = Moon
			minInclination = 135
			minPeA = 5000000
			disableOnStateChange = true
			title = Retrograde lunar orbit: inclination above 135 deg, periapsis above 5,000 km
		}
		PARAMETER
		{
			name = ComeHome
			type = ReturnHome
			completeInSequence = true
			title = Return safely to Earth
		}
	}
}
