// Manifest id: ARTEMIS-IV (2028) - first crewed landing since 1972.
// Two crew descend, two stay in the crew vehicle in lunar orbit. No Gateway:
// the crew vehicle meets the lander directly in lunar orbit.
// Sites: NASA's nine 2024 candidate regions (manifest ARTEMIS-IV.candidate_sites,
// points from manifest sites[], v2). Two moonwalks, per the Oct 2026 briefing;
// the multi-day stay is an optional bonus.
CONTRACT_TYPE
{
	name = MKSP_Artemis4
	group = MKSP_Crewed
	title = Artemis IV: First South Pole Landing
	description = Humans return to the Moon. With four crew in lunar orbit, send two down in a lander to one of NASA's nine candidate landing regions near the south pole while two stay aloft. Make two moonwalks, plant the flag, file an EVA report and bring a surface sample home. The real crews plan two moonwalks of about two hours; staying two full days on the surface earns a bonus.
	synopsis = Land two crew within 3 km of a NASA candidate region, make two moonwalks, and return a sample.
	completedMessage = Footprints at the south pole. The first humans on the Moon since 1972 are home with the samples.
	notes = Real-world analogue: Artemis IV. Fails if anyone dies.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 765000
	rewardFunds = 935000
	rewardReputation = 250
	failureFunds = 765000
	failureReputation = 120

	REQUIREMENT
	{
		name = Artemis3Done
		type = CompleteContract
		contractType = MKSP_Artemis3
		title = Complete Artemis III
	}
	REQUIREMENT
