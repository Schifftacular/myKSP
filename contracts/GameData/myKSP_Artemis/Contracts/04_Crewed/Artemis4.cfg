// Manifest id: ARTEMIS-IV (2028) - first crewed landing since 1972.
// Two crew descend, two stay in the crew vehicle in lunar orbit. No Gateway:
// the crew vehicle meets the lander directly in lunar orbit.
CONTRACT_TYPE
{
	name = MKSP_Artemis4
	group = MKSP_Crewed
	title = Artemis IV: First South Pole Landing
	description = Humans return to the Moon. With four crew in lunar orbit, send two down in a lander to within 10 km of the Shackleton ridge base site while two stay aloft. Stay at least two days, plant the flag, file an EVA report, and bring a south-pole surface sample home. The real crews plan two short moonwalks totalling about two hours.
	synopsis = Land two crew within 10 km of the base site, stay two days, and return a south-pole sample.
	completedMessage = Footprints at the south pole. The first humans on the Moon since 1972 are home with the samples.
	notes = Real-world analogue: Artemis IV. Fails if anyone dies.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 765000
	rewardFunds = 935000
	rewardReputation = 250
	failureFunds = 765000
	failureReputation = 120

	REQUIREMENT
	{
		name = Artemis3Done
		type = CompleteContract
		contractType = MKSP_Artemis3
		title = Complete Artemis III
	}
	REQUIREMENT
	{
		name = LanderDemoDone
		type = CompleteContract
		contractType = MKSP_HLS_UncrewedLanding
		title = Complete an uncrewed HLS landing demo
	}

	BEHAVIOUR
	{
		name = BaseSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.45
			longitude = -137.5
		}
	}

	PARAMETER
	{
		name = Lander
		type = VesselParameterGroup
		title = Crewed lander at the south pole
		define = mkspArtemis4Lander

		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			title = At least two crew aboard
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			biome = South Pole
			situation = LANDED
			disableOnStateChange = true
			title = Land in the South Pole region
		}
		PARAMETER
		{
			name = NearBase
			type = VisitWaypoint
			index = 0
			horizontalDistance = 10000
			title = Within 10 km of the base site
		}
	}
	PARAMETER
	{
		name = SurfaceStay
		type = VesselParameterGroup
		vessel = mkspArtemis4Lander
		duration = 2d
		completeInSequence = true
		title = Lander stays on the surface for two days

		PARAMETER
		{
			name = StillLanded
			type = ReachState
			targetBody = Moon
			situation = LANDED
		}
	}
	PARAMETER
	{
		name = Flag
		type = PlantFlag
		targetBody = Moon
		title = Plant a flag on the Moon
	}
	PARAMETER
	{
		name = EVAReport
		type = CollectScience
		targetBody = Moon
		biome = South Pole
		situation = SrfLanded
		experiment = evaReport
		recoveryMethod = RecoverOrTransmit
		title = File an EVA report from the South Pole region
	}
	PARAMETER
	{
		name = OrbitCrew
		type = VesselParameterGroup
		title = Crew vehicle waits in lunar orbit and brings everyone home
		completeInSequence = true

		PARAMETER
		{
			name = NotLander
			type = IsNotVessel
			vessel = mkspArtemis4Lander
		}
		PARAMETER
		{
			name = OrbitCrew
			type = HasCrew
			minCrew = 2
			title = At least two crew aboard
		}
		PARAMETER
		{
			name = LunarOrbit
			type = Orbit
			targetBody = Moon
			minPeA = 15000
			disableOnStateChange = true
			title = In lunar orbit
		}
		PARAMETER
		{
			name = ComeHome
			type = ReturnHome
			completeInSequence = true
			title = Return safely to Earth
		}
	}
	PARAMETER
	{
		name = Sample
		type = CollectScience
		targetBody = Moon
		biome = South Pole
		situation = SrfLanded
		experiment = surfaceSample
		recoveryMethod = Recover
		title = Recover a south-pole surface sample on Earth
	}
	PARAMETER
	{
		name = NoLosses
		type = KerbalDeaths
		title = Lose no crew
	}
}
