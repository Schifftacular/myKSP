// Manifest id: FISSION-SURFACE-POWER (2030+, speculative since NASA paused the
// procurement; goal ~40 kWe, 10+ year life). The install has no 40 kWe reactor:
// the stand-in is eight 5 kW EDB TOPAZ II units (mod thread, lunar-base-parts.md),
// so the check is eight generator parts, not a specific part.
// The reactor sits at its own site ~1.5 km from the habitat area, as a real
// reactor would for radiation standoff.
CONTRACT_TYPE
{
	name = MKSP_Base_FissionPower
	group = MKSP_BaseCamp
	title = Fission Surface Power Reactor
	description = Solar power fails in the long polar nights. Land an uncrewed reactor package of at least 6 tonnes with eight or more generators (about 40 kWe) within 500 m of the reactor site, about 1.5 km from the habitat area for radiation standoff, and keep it powered for a full 30-day lunar cycle.
	synopsis = Land a 6 t+ package with 8+ generators at the reactor site and keep it powered for 30 days.
	completedMessage = The reactor is online. The base has power that doesn't care where the Sun is.
	notes = Real-world analogue: NASA/DOE Fission Surface Power. Any part with a ModuleGenerator (RTG, reactor stand-in) counts.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 470000
	rewardFunds = 580000
	rewardReputation = 90
	failureFunds = 470000
	failureReputation = 40

	REQUIREMENT
	{
		name = Artemis4Done
		type = CompleteContract
		contractType = MKSP_Artemis4
		title = Complete Artemis IV
	}

	BEHAVIOUR
	{
		name = ReactorSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Fission Reactor Site
			icon = gravity
			targetBody = Moon
			latitude = -89.45
			longitude = -135.5
		}
	}

	PARAMETER
	{
		name = Reactor
		type = VesselParameterGroup
		title = Reactor package powered at the site for 30 days
		define = mkspFSP
		duration = 30d

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = Heavy
			type = VesselMass
			minMass = 6.0
			title = At least 6 t
		}
		PARAMETER
		{
			name = Generator
			type = PartValidation
			partModule = ModuleGenerator
			minCount = 8
			title = At least eight generators (about 40 kWe)
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtSite
			type = VisitWaypoint
			index = 0
			horizontalDistance = 500
			title = Within 500 m of the reactor site
		}
		PARAMETER
		{
			name = Powered
			type = HasResource
			resource = ElectricCharge
			minQuantity = 1
			title = Stays powered
		}
	}
}
