// Manifest id: FISSION-SURFACE-POWER (by 2030, NASA/DOE goal; ~40 kWe, 10+ year life).
// The reactor sits at its own site ~1.5 km from the habitat area, as a real
// reactor would for radiation standoff.
CONTRACT_TYPE
{
	name = MKSP_Base_FissionPower
	group = MKSP_BaseCamp
	title = Fission Surface Power Reactor
	description = Solar power fails in the long polar nights. Land an uncrewed reactor package of at least 4 tonnes with a generator within 500 m of the reactor site, about 1.5 km from the habitat area for radiation standoff, and keep it powered for a full 30-day lunar cycle.
	synopsis = Land a 4 t+ generator package at the reactor site and keep it powered for 30 days.
	completedMessage = The reactor is online. The base has power that doesn't care where the Sun is.
	notes = Real-world analogue: NASA/DOE Fission Surface Power. Any part with a ModuleGenerator (RTG, reactor stand-in) counts.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 250000
	rewardFunds = 800000
	rewardReputation = 90
	failureFunds = 250000
	failureReputation = 40

	REQUIREMENT
	{
		name = Artemis4Done
		type = CompleteContract
		contractType = MKSP_Artemis4
		title = Complete Artemis IV
	}

	BEHAVIOUR
	{
		name = ReactorSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Fission Reactor Site
			icon = gravity
			targetBody = Moon
			latitude = -89.40
			longitude = -137.5
		}
	}

	PARAMETER
	{
		name = Reactor
		type = VesselParameterGroup
		title = Reactor package powered at the site for 30 days
		define = mkspFSP
		duration = 30d

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			maxCrew = 0
		}
		PARAMETER
		{
			name = Heavy
			type = VesselMass
			minMass = 4.0
			title = At least 4 t
		}
		PARAMETER
		{
			name = Generator
			type = PartValidation
			partModule = ModuleGenerator
			minCount = 1
			title = Has a generator
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtSite
			type = VisitWaypoint
			index = 0
			horizontalDistance = 500
			title = Within 500 m of the reactor site
		}
		PARAMETER
		{
			name = Powered
			type = HasResource
			resource = ElectricCharge
			minQuantity = 1
			title = Stays powered
		}
	}
}
