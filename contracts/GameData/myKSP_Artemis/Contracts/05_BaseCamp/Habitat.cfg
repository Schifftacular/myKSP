// Manifest id: MOON-BASE-PHASE-2-HABITAT (Phase 2, 2029-2032, speculative).
// Consumables are 30 days for four crew at TAC Life Support rates
// (Food 1.69e-5, Water 1.12e-5, Oxygen 1.71e-3 units/s per crew member).
CONTRACT_TYPE
{
	name = MKSP_Base_Habitat
	group = MKSP_BaseCamp
	title = First Surface Habitat
	description = Sortie landers can't host a permanent crew. Land a habitat module with room for four within 1 km of the Shackleton ridge site, with its own power source and stocked with 30 days of consumables for four (175 Food, 116 Water, 17,770 Oxygen).
	synopsis = Land a powered, stocked four-person habitat within 1 km of the base site.
	completedMessage = The habitat is down, powered and stocked. The base has a front door.
	notes = Real-world basis: NASA Moon Base Phase 2 habitat. RealFuels ServiceModule or Fuselage tanks can hold Food, Water and Oxygen.

	targetBody = Moon
	prestige = Exceptional
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 300000
	rewardFunds = 1000000
	rewardReputation = 100
	failureFunds = 300000
	failureReputation = 50

	REQUIREMENT
	{
		name = Artemis5Done
		type = CompleteContract
		contractType = MKSP_Artemis5
		title = Complete Artemis V
	}

	BEHAVIOUR
	{
		name = BaseSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.45
			longitude = -137.5
		}
	}

	PARAMETER
	{
		name = Hab
		type = VesselParameterGroup
		title = Habitat at the base site
		define = mkspBaseHab

		PARAMETER
		{
			name = FourBerths
			type = HasCrewCapacity
			minCapacity = 4
			title = Room for at least four crew
		}
		PARAMETER
		{
			name = PowerSource
			type = Any
			title = Has a power source (solar, RTG or fuel cell)
			hideChildren = true
			PARAMETER
			{
				name = Solar
