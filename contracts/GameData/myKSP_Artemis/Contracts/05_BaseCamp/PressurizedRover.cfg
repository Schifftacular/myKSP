// Manifest id: none yet - JAXA/Toyota pressurised rover (early 2030s) and
// Moon Base Phase 3 crewed mobility. Post-2030 stretch goal.
CONTRACT_TYPE
{
	name = MKSP_Base_PressurizedRover
	group = MKSP_BaseCamp
	title = Pressurized Rover Expedition
	description = A shirt-sleeve rover turns the base into a hub for the whole south polar region. Drive a crewed rover with at least two aboard from the base to an outpost site about 20 km away and back to within 500 m of the base.
	synopsis = Drive two crew 20 km to the outpost site and back in a rover.
	completedMessage = Forty kilometres round trip without a spacesuit. The south pole just got a lot smaller.
	notes = Real-world basis: JAXA/Toyota pressurised rover. Any crewed, wheeled vessel counts. Fails if anyone dies.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 290000
	rewardFunds = 360000
	rewardReputation = 70
	failureFunds = 290000
	failureReputation = 35

	REQUIREMENT
	{
		name = Artemis7Done
		type = CompleteContract
		contractType = MKSP_Artemis7
		title = Complete Artemis VII
	}

	BEHAVIOUR
	{
		name = Sites
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.45
			longitude = -137.5
		}
		WAYPOINT
		{
			name = Outpost Site
			icon = sample
			targetBody = Moon
			latitude = -88.80
			longitude = -137.5
		}
	}

	PARAMETER
	{
		name = Rover
		type = VesselParameterGroup
		title = Crewed rover expedition

		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			title = At least two crew aboard
		}
		PARAMETER
		{
			name = Wheels
			type = Any
			title = Has rover wheels
			hideChildren = true
			PARAMETER
			{
				name = KSPWheels
				type = PartValidation
				partModule = KSPWheelBase
				minCount = 1
			}
			PARAMETER
			{
				name = StockWheels
				type = PartValidation
				partModule = ModuleWheelBase
				minCount = 1
			}
		}
		PARAMETER
		{
			name = Outbound
			type = VisitWaypoint
			disableOnStateChange = true
			index = 1
			horizontalDistance = 300
			title = Reach the outpost site
		}
		PARAMETER
		{
			name = Return
			type = VisitWaypoint
			index = 0
			horizontalDistance = 500
			completeInSequence = true
			title = Return to within 500 m of the base
		}
	}
	PARAMETER
	{
		name = NoLosses
		type = KerbalDeaths
		title = Lose no crew
	}
}
