// Manifest id: LTV-DELIVERY (2028, before the Artemis IV crew) - Astrolab
// CLV-1 and Lunar Outpost Pegasus unpressurised rovers.
CONTRACT_TYPE
{
	name = MKSP_LTV_Delivery
	group = MKSP_BaseCamp
	title = Lunar Terrain Vehicle Delivery
	description = Crews will cover far more ground with wheels. Land an unpressurised terrain vehicle (seats for two, wheels) anywhere in the South Pole region, then drive it uncrewed by remote control to the staging point beside the base site, where the next crew will pick it up.
	synopsis = Land a two-seat rover in the South Pole region and teleoperate it to the base staging point.
	completedMessage = The terrain vehicle is parked at the base staging point and checked out.
	notes = Real-world analogue: LTV delivery of Astrolab CLV-1 and Lunar Outpost Pegasus. Seats can be command seats or a crew cabin.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 225000
	rewardFunds = 275000
	rewardReputation = 45
	failureFunds = 225000
	failureReputation = 20

	REQUIREMENT
	{
		name = GriffinDone
		type = CompleteContract
		contractType = MKSP_MoonBase2_Griffin
		title = Complete Moon Base II
	}
	REQUIREMENT
	{
		name = MoonBase1Done
		type = CompleteContract
		contractType = MKSP_MoonBase1_Endurance
		title = Complete Moon Base I
	}

	BEHAVIOUR
	{
		name = Staging
		type = WaypointGenerator
		WAYPOINT
		{
			name = LTV Staging Point
			icon = vessel
			targetBody = Moon
			latitude = -89.44
			longitude = -130.0
		}
	}

	PARAMETER
	{
		name = Rover
		type = VesselParameterGroup
		title = Uncrewed two-seat terrain vehicle
		define = mkspLTV

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = TwoSeats
			type = HasCrewCapacity
			minCapacity = 2
			title = Seats for at least two
		}
		PARAMETER
		{
			name = Wheels
			type = Any
			title = Has rover wheels
			hideChildren = true
			PARAMETER
			{
				name = KSPWheels
				type = PartValidation
				partModule = KSPWheelBase
				minCount = 1
			}
			PARAMETER
			{
				name = StockWheels
				type = PartValidation
				partModule = ModuleWheelBase
				minCount = 1
			}
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			biome = South Pole
			situation = LANDED
			disableOnStateChange = true
			title = Land in the South Pole region
		}
		PARAMETER
		{
			name = Staged
			type = VisitWaypoint
			index = 0
			horizontalDistance = 100
			completeInSequence = true
			title = Drive to within 100 m of the staging point
		}
	}
}
