// Manifest: program_context.moon_base_program (Phase 3 "site-prep" and
// resource use). Ore stands in for icy regolith; RO's Drill-O-Matic parts
// (MiniDrill, RadialDrill) are the harvesters available in this install.
CONTRACT_TYPE
{
	name = MKSP_Base_ISRU
	group = MKSP_BaseCamp
	title = Base ISRU: Harvest Polar Regolith
	description = Every kilogram of oxygen or water made on the Moon is a kilogram we don't launch. Land an uncrewed harvester within 2 km of the base site, launched with empty ore tanks, and fill it with at least 200 units of ore from the polar regolith.
	synopsis = Land an empty harvester near the base and collect 200 ore.
	completedMessage = The base is mining. ISRU has gone from slide deck to stockpile.
	notes = Real-world basis: NASA lunar ISRU demonstrations and Moon Base Phase 3 site preparation.

	targetBody = Moon
	prestige = Significant
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 60
	deadline = 1460
	maxCompletions = 1
	maxSimultaneous = 1

	advanceFunds = 360000
	rewardFunds = 440000
	rewardReputation = 60
	failureFunds = 360000
	failureReputation = 30

	REQUIREMENT
	{
		name = LIDDone
		type = CompleteContract
		contractType = MKSP_LID_Node
		title = Complete a Lunar Infrastructure Demo node
	}

	BEHAVIOUR
	{
		name = BaseSite
		type = WaypointGenerator
		WAYPOINT
		{
			name = Artemis Base Camp - Shackleton Ridge
			icon = marker
			targetBody = Moon
			latitude = -89.5
			longitude = -135.5
		}
	}

	PARAMETER
	{
		name = Harvester
		type = VesselParameterGroup
		title = Uncrewed harvester at the base

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
		}
		PARAMETER
		{
			name = LaunchedEmpty
			type = HasResource
			resource = Ore
			maxQuantity = 0
			disableOnStateChange = true
			title = Launched with no ore aboard
		}
		PARAMETER
		{
			name = Drill
			type = PartValidation
			partModule = ModuleResourceHarvester
			minCount = 1
			title = Has a resource harvester
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			disableOnStateChange = true
			title = Landed on the Moon
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			disableOnStateChange = true
			index = 0
			horizontalDistance = 2000
			title = Within 2 km of the base site
		}
		PARAMETER
		{
			name = Mined
			type = HasResource
			resource = Ore
			minQuantity = 200
			completeInSequence = true
			title = Holds at least 200 ore
		}
	}
}
