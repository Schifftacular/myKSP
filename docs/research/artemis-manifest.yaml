# myKSP — NASA lunar mission manifest, now through 2030
#
# Owner: research thread ("Track NASA Artemis plans through 2030").
# Consumer: contracts thread. Build contracts from these entries; never hard-code
# real-world dates in contracts without reading `status` and `confidence` first.
#
# Rules for editors
#   * `id` is permanent. Never delete or rename an entry. If a mission is cancelled,
#     set status: cancelled and explain in `notes`. Contracts key off `id`.
#   * Every fact needs a source in `sources`. Prefer nasa.gov; trade press second.
#   * `confidence` describes how sure we are the mission flies roughly as described:
#       confirmed   – NASA has announced it with hardware/contract/crew in work
#       likely      – announced or contracted, but date or details are soft
#       speculative – our projection from NASA's stated cadence; not announced
#   * `target` is the real-world target as NASA (or the best source) states it.
#     `window` is a normalised year/quarter range for game scheduling.
#   * Bump `manifest_version` and add a line to changelog.md on every edit.
#   * Run: python3 tools/validate_manifest.py
#
manifest_version: 1
as_of: "2026-11-06"
career_goal: >-
  Permanent crewed lunar base at the lunar south pole, mirroring NASA's
  three-phase Moon Base program (Phase 1 now–2029, Phase 2 2029–2032,
  Phase 3 2032+).

# ---------------------------------------------------------------------------
# Program-level facts the contracts thread should treat as world state.
# ---------------------------------------------------------------------------
program_context:
  - key: gateway_paused
    fact: >-
      Lunar Gateway was paused "in its current form" on 2026-03-24 (several outlets
      call it effectively cancelled). Orion now docks with landers directly; there is
      no NRHO station in the plan. HALO hardware is being converted by Northrop
      Grumman into three Lunar Infrastructure Demo (LID) surface missions. Fate of
      PPE and I-Hab not published as of 2026-11-06.
    confidence: confirmed
    sources: [sfn-2026-03-25, sfn-2026-08-06, sciam-2026-03-24]
  - key: sls_block1_only
    fact: >-
      SLS Block 1B, Block 2, the Exploration Upper Stage and Mobile Launcher 2 were
      cancelled (announced 2026-02-26/27). SLS stays near-Block 1. For Artemis IV NASA
      is weighing the existing ICPS or a stretched Centaur V upper stage. NASA has
      said it intends to move crews to commercial launchers after the current SLS
      flights; which vehicle is not decided.
    confidence: confirmed
    sources: [nasa-2026-03-03, satnews-2026-02-27, nasa-2026-11-04]
  - key: moon_base_program
    fact: >-
      NASA "Moon Base" program announced at the Ignition event 2026-03-24: about
      $20B over seven years (Isaacman; Scientific American reported $30B by 2036),
      three phases at the south pole. Phase 1 "Now–2029" gain access / experiment /
      learn; Phase 2 2029–2032 "Build and Expand" (habitats, regular surface ops);
      Phase 3 2032+ "Live and Work on the Moon" (fission + solar power, crewed and
      uncrewed rovers, site-prep machines, surface comms network, lunar GPS, relay
      and observation constellations).
    confidence: confirmed
    sources: [sfn-2026-03-25, nasa-moonbase-phases, sciam-2026-03-24]
  - key: landing_cadence
    fact: >-
      Isaacman's stated goal is crewed landings about every six months with at least
      two lander providers. NASA's March architecture note said "about one lunar
      mission per year" after Artemis V. Treat two-per-year as the aspiration and
      one-per-year as the baseline.
    confidence: likely
    sources: [sfn-2026-03-25, nasa-2026-03-03]
  - key: clps_cadence
    fact: >-
      Isaacman wants about 10 CLPS deliveries per year for three years starting 2027.
      CLPS 2.0 RFP released 2026-05-15 (responses due 2026-06-30). Every CLPS task
      order so far has slipped substantially; schedule all robotic missions with slack.
    confidence: likely
    sources: [spo-2026-05-26, nasa-2026-05-26]
  - key: two_lander_strategy
    fact: >-
      Both SpaceX Starship HLS and Blue Origin Blue Moon MK2 are in the plan; neither
      is assigned to a specific landing as of 2026-10-23. Starship reaches the Moon by
      refuelling in LEO (tanker count estimates range 6–8 to 22) and then carries
      itself to low lunar orbit to meet Orion. Blue Moon MK2 uses three Blue Moon MK1
      derived transfer stages to reach an elliptical polar lunar orbit. Each provider
      must fly one uncrewed landing before a crewed one.
    confidence: confirmed
    sources: [nasa-2026-10-23-landers, spo-2026-10-23, satnews-2026-11-03]
  - key: surface_ops_first_landings
    fact: >-
      Two crew descend, two stay in Orion. First landings target two moonwalks
      totalling about two hours, in a simplified Axiom "sortie" suit.
    confidence: confirmed
    sources: [spo-2026-10-23, nasa-2026-11-04]
  - key: south_pole_site_open
    fact: >-
      South pole remains the target. NASA says robotic data is still needed before
      choosing a crew landing site. A NASEM report (Oct 2026) proposed four non-polar
      sites; Isaacman called an Apollo-site return "very cool at some point."
    confidence: likely
    sources: [spo-2026-10-23]
  - key: fission_power_2030
    fact: >-
      NASA and DOE goal (MOU, Jan 2026): a lunar surface fission reactor by 2030,
      about 40 kWe class, 10+ year life, via funded Space Act Agreements. No flight
      award found as of 2026-11-06.
    confidence: likely
    sources: [doe-2026-01, lockheed-fsp-2026]
  - key: china_competition
    fact: >-
      China targets a crewed landing by 2030. Chang'e-7 (south pole orbiter, lander,
      rover, hopper) was stood down a day before launch in Aug 2026; next window
      possibly early 2027. Useful as world "pressure" events, not NASA contracts.
    confidence: likely
    sources: [ap-2026-08-23, sciam-2026-03-24]

