# ---------------------------------------------------------------------------
# Landing sites. Selenographic degrees, longitude east-positive (-180..180), south negative.
# NASA has not published centre points for its candidate regions; most points below are
# centres of the LROC NAC mosaics NASA commissioned for each region. `precision` says how
# far to trust the point: high (published aim point/feature centre), medium (mosaic centre),
# low (estimated). Contracts should use a landing radius of a few km for low/medium points.
# ---------------------------------------------------------------------------
sites:
  - {id: SP-CONNECTING-RIDGE, name: "Shackleton connecting ridge (Shackleton–de Gerlache ridge)", lat: -89.5, lon: -135.5, precision: medium, role: "Moon Base I target; recommended base anchor point", basis: "Centre of LROC NAC_DTM_SHACKRDGE02 (lat -89.63..-89.37, lon 209.8..239.1 E)", sources: [lroc-rdr]}
  - {id: SP-PEAK-NEAR-CABEUS-B, name: Peak near Cabeus B, lat: -83.6, lon: -68.8, precision: medium, role: Artemis candidate region (2024), basis: LROC mosaic centre, sources: [nasa-2024-10-regions, lroc-rdr]}
  - {id: SP-HAWORTH, name: Haworth, lat: -86.7, lon: -23.7, precision: medium, role: Artemis candidate region (2024), basis: LROC mosaic centre, sources: [nasa-2024-10-regions, lroc-rdr]}
  - {id: SP-MALAPERT-MASSIF, name: Malapert Massif, lat: -86.0, lon: 0.3, precision: medium, role: Artemis candidate region (2024), basis: LROC mosaic centre, sources: [nasa-2024-10-regions, lroc-rdr]}
  - {id: SP-MONS-MOUTON, name: Mons Mouton (VIPER mission area), lat: -85.42088, lon: 31.6218, precision: high, role: "Artemis candidate region (2024); VIPER traverse area; Griffin's original site", basis: "VIPER site analysis paper; ~5x4 km area on the south edge of Mons Mouton", sources: [nasa-2024-10-regions, psj-viper-site]}
  - {id: SP-MONS-MOUTON-PLATEAU, name: Mons Mouton Plateau, lat: -84.6, lon: 31.0, precision: low, role: Artemis candidate region (2024), basis: Mountain summit position, sources: [nasa-2024-10-regions, wiki-mons-mouton]}
  - {id: SP-NOBILE-RIM-1, name: Nobile Rim 1, lat: -85.4, lon: 39.0, precision: low, role: Artemis candidate region (2024), basis: "Eastern part of LROC combined Mouton/Nobile mosaic; estimated", sources: [nasa-2024-10-regions, lroc-rdr]}
  - {id: SP-NOBILE-RIM-2, name: Nobile Rim 2, lat: -83.9, lon: 58.7, precision: medium, role: Artemis candidate region (2024), basis: "LROC mosaic centre; a 2024 study's top site is -84.2016, 60.6999", sources: [nasa-2024-10-regions, lroc-rdr, arxiv-2406-19863]}
  - {id: SP-DE-GERLACHE-RIM-2, name: de Gerlache Rim 2, lat: -88.5, lon: -66.7, precision: low, role: Artemis candidate region (2024), basis: "Centre of LROC de Gerlache Rim mosaic covering Rim 1 and 2", sources: [nasa-2024-10-regions, lroc-rdr]}
  - {id: SP-SLATER-PLAIN, name: Slater Plain, lat: -87.9, lon: 115.0, precision: low, role: Artemis candidate region (2024), basis: "~20 km NE of Slater crater (-88.08, 111.29); estimated", sources: [nasa-2024-10-regions, jgr-2026-slater]}
  - {id: SP-PEAK-NEAR-SHACKLETON, name: Peak near Shackleton, lat: -88.8, lon: 124.7, precision: medium, role: "2022 candidate region, dropped from the 2024 list", basis: LROC mosaic centre, sources: [lroc-rdr]}
  - {id: SP-NOBILE-CRATER, name: Nobile crater region, lat: -85.28, lon: 53.27, precision: low, role: "Griffin-1 target region (no aim point published)", basis: Nobile crater centre, sources: [wiki-griffin-1]}
  - {id: NS-REINER-GAMMA, name: Reiner Gamma (Lunar Vertex site), lat: 7.585, lon: -58.725, precision: high, role: Moon Base III (IM-3) target, basis: "Lunar Vertex team's chosen site, north edge of the central bright oval", sources: [wiki-reiner-gamma, jhuapl-lunar-vertex]}
  - {id: NS-GRUITHUISEN-GAMMA, name: Gruithuisen Domes (Mons Gruithuisen Gamma), lat: 36.45715, lon: -40.79602, precision: high, role: "Blue Ghost M3 target; Peregrine 2/3 per Astrobotic", basis: "Lunar-VISE 100 m landing ellipse near the summit", sources: [psj-lunar-vise, firefly-bgm3]}

# ---------------------------------------------------------------------------
# Repeatable contract template derived from NASA's CLPS model.
# ---------------------------------------------------------------------------
clps_template:
  description: >-
    NASA buys delivery as a service: a commercial provider carries NASA payloads to a
    named site for a fixed price. Most CLPS missions slip. Good fit for a recurring,
    procedurally generated contract the player can fulfil as "the provider".
  parameters:
    - payload_mass_kg: 20–500 (Phase 1), larger later
    - site: from destinations above, weighted toward south pole
    - deadline: generous; late delivery reduces reward rather than failing
    - bonus: precision landing radius, surviving the lunar night, deploying a rover

