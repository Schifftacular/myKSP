// myKSP orphan-part rescue, part 2 (2026-11-06).
//
// Places parts whose TechRequired names a node that does not exist in the RP2000 tree,
// so they can be researched in career. Same approach as ZZZ_RP2000_Fixes/OrphanTechNodes.cfg:
// runs at :FINAL and only touches parts whose current node is missing (unlockParts,
// standardDockingPorts, improvedCapsules, OrphanParts, largeControl, spaceStationSolarPanels,
// capsulesNF, flightControlNF, orbitalRocketryNF). Deprecated parts are deliberately left hidden.
// Generated by tools/mod-inventory from ModuleManager.ConfigCache + ModuleManager.TechTree.
// Node choice: manufacturer/era nodes where RP2000 has them (energiaLegacy, boeingLegacy,
// northropLegacy, gdLegacy, spacexFuture, ...), otherwise the matching generic CTT node.
// Delete this file to undo.

